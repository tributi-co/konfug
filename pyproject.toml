[project]
name = "konfug"
version = "0.0.7"
description = "The configuration source for all your projects"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Sergio Pulgarin", email = "serpulga@gmail.com" }]
keywords = ["konfug", "datastore", "configuration"]
requires-python = ">=3.13,<3.16"
dependencies = [
    "google-cloud-secret-manager==2.32.0",
    "google-cloud-datastore==2.21.0",
    "firebase-admin==7.1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/tributi-co/konfug"

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["konfug.py"]

[tool.hatch.build.targets.sdist]
include = ["konfug.py", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
